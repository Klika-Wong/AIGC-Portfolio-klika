<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>原创角色 · 轻吐槽气泡预览 v0.1</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#232d32;background:#e8e9e6}*{box-sizing:border-box}body{margin:0;padding:18px}
.layout{display:grid;grid-template-columns:minmax(250px,500px) minmax(240px,360px);gap:18px;max-width:950px;margin:auto}
.stage{height:min(78vh,790px);min-height:480px;position:relative;border:1px solid #c7cbc7;border-radius:22px;overflow:hidden;background:linear-gradient(#f7f7f3,#d7dcd7)}
figure{margin:0;height:100%;display:flex;justify-content:center;align-items:flex-end}figure img{height:96%;max-width:100%;object-fit:contain;object-position:bottom}
.bubble{position:absolute;right:5%;top:12%;max-width:53%;padding:12px 16px;border:1px solid #d8d5c9;background:#fffefaef;color:#404b48;border-radius:18px 18px 4px 18px;box-shadow:0 8px 25px #2223;font-size:clamp(13px,1.8vw,16px);line-height:1.5;opacity:0;transform:translateY(8px) scale(.96);transition:opacity .23s,transform .23s;pointer-events:none}
.bubble.visible{opacity:1;transform:none}.bubble:after{content:"";position:absolute;right:10px;bottom:-11px;border-left:10px solid transparent;border-top:12px solid #fffefaef}
.panel{background:#fafaf7;border-radius:20px;padding:20px;box-shadow:0 4px 18px #0001}.panel h1{font-size:20px;margin:0 0 8px}.muted{color:#62706c;font-size:13px;line-height:1.7}button{border:1px solid #abb8af;border-radius:10px;background:white;color:#24322d;padding:10px 12px;cursor:pointer;margin:4px 3px 4px 0}button:hover{background:#e4e9e4}button:focus-visible,input:focus-visible{outline:3px solid #608a8a}button.primary{background:#344c42;color:white}label{display:block;margin:12px 0}output{display:block;padding:11px;background:#e6eae5;border-radius:8px;font-size:13px;min-height:54px;white-space:pre-wrap}.chip{display:inline-block;background:#e1e7e1;border-radius:14px;font-size:12px;padding:3px 9px}.stage-note{position:absolute;bottom:8px;left:10px;font-size:11px;background:#ffffffc7;padding:5px 8px;border-radius:7px}@media(max-width:740px){.layout{grid-template-columns:1fr}.stage{height:62vh;min-height:420px}.bubble{top:8%;right:3%}}@media(prefers-reduced-motion:reduce){.bubble{transition:none}}
</style></head><body><main class="layout">
<section class="stage" aria-label="原创角色和气泡效果预览"><figure><img src="../../人物设定-1/主要形象.jpg" alt="AIGC 仓库中的原始角色参考图（仅用于演示叠加层）"></figure>
<div id="bubble" class="bubble" role="status" aria-live="off"></div><div class="stage-note">原始角色图片 · 独立气泡层（非 Live2D 绑定）</div></section>
<section class="panel"><h1>轻吐槽 · 内心 OS</h1><span class="chip">v0.1 原型</span>
<p class="muted">角色图片直接引用仓库原图；气泡为前端叠加层。正式版将此层放在 Live2D Canvas 上方。</p>
<label><input id="enabled" type="checkbox" checked> 允许出现内心气泡</label>
<label><input id="serious" type="checkbox"> 严肃 / 隐私模式（强制静默）</label>
<p><button class="primary" id="task">新任务</button><button id="curious">有趣问题</button><button id="revision">反复修改</button><button id="praise">收到夸赞</button><button id="done">任务完成</button></p>
<p><button id="random">按真实频率模拟</button><button id="demo">仅演示：跳过冷却</button><button id="hide">关闭当前气泡</button></p>
<p class="muted">默认事件采用 20% 抽样、全局冷却 120 秒、每 10 分钟最多 2 次。演示按钮仅方便看视觉，不代表实际频率。严肃模式与总开关在演示模式同样有效。</p>
<output id="log" aria-live="polite">准备就绪。点击一个事件，再点“仅演示”可看到气泡。</output>
</section></main>
<script>
"use strict";
const config={probability:0.2,cooldownMs:120000,windowMs:600000,maxPerWindow:2,durationMs:2600};
const bank={new_task:["又有新任务了呀。","这次又是什么呢。"],curious:["哦？有点意思。","这个角度可以。"],revision:["第几版来着……","好好好，再调整。"],praise:["有点开心，藏一下。","夸奖收到了。"],completed:["这次发挥还不错。","嗯，稳稳完成。"]};
const ui={bubble:document.querySelector("#bubble"),log:document.querySelector("#log"),enabled:document.querySelector("#enabled"),serious:document.querySelector("#serious")};
let current="new_task",lastAt=-Infinity,history=[],timer=0,seen=new Set();
const say=s=>{ui.log.textContent=s};
function hide(){clearTimeout(timer);ui.bubble.classList.remove("visible");timer=0}
function show(category,{force=false,eventId=null}={}){
 if(!ui.enabled.checked||ui.serious.checked){hide();say("静默：用户关闭气泡或处于严肃/隐私模式。");return false}
 if(eventId&&seen.has(eventId)){say("已去重。");return false}
 const now=Date.now();history=history.filter(t=>now-t<config.windowMs);
 if(!force&&(now-lastAt<config.cooldownMs||history.length>=config.maxPerWindow)){say("跳过：触发冷却或 10 分钟上限。");return false}
 if(!force&&Math.random()>=config.probability){say("本次不触发（偶发概率筛选）。");return false}
 if(ui.bubble.classList.contains("visible")){say("已有气泡，拒绝排队。");return false}
 const options=bank[category]||bank.new_task;const message=options[Math.floor(Math.random()*options.length)];
 if(message.length>32){say("文案长度不合规。");return false}
 ui.bubble.textContent=message;ui.bubble.classList.add("visible");if(!force){history.push(now);lastAt=now}if(eventId){seen.add(eventId);if(seen.size>100)seen.clear()}
 timer=setTimeout(hide,config.durationMs);say("展示："+message+(force?"（演示模式）":""));return true
}
const map={task:"new_task",curious:"curious",revision:"revision",praise:"praise",done:"completed"};
for(const [id,cat] of Object.entries(map)){document.getElementById(id).addEventListener("click",()=>{current=cat;show(cat)})}
document.getElementById("random").addEventListener("click",()=>show(current));
document.getElementById("demo").addEventListener("click",()=>{hide();show(current,{force:true})});
document.getElementById("hide").addEventListener("click",()=>{hide();say("已关闭当前气泡。")});
ui.enabled.addEventListener("change",()=>{if(!ui.enabled.checked){hide();say("用户已关闭气泡。")}});
ui.serious.addEventListener("change",()=>{if(ui.serious.checked){hide();say("严肃 / 隐私模式：气泡禁用。")}});
window.addEventListener("pagehide",hide);
</script></body></html>
