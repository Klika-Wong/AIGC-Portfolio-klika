name: Test Klika AI avatar runtime
on:
  push:
    branches: [feature/live2d-thought-bubbles-v0.1]
    paths:
      - 'AIGC/项目-01-角色视觉资产/Live2D-开发中/05-Agent接入/**'
      - '.github/workflows/klika-agent-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: klika-agent-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime and tests
        run: python -m pip install -r "AIGC/项目-01-角色视觉资产/Live2D-开发中/05-Agent接入/requirements.txt" httpx pytest
      - name: Test avatar app without a real paid API call
        run: python -m pytest -q "AIGC/项目-01-角色视觉资产/Live2D-开发中/05-Agent接入/test_server.py"
